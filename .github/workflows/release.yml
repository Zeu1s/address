name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.1.0
        required: true
        default: v2.1.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$version" == "v$package_version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<'NOTES'
          ### Address data and sources
          - Assigns missing districts and cities from official or open boundary polygons (COD-AB, IBGE, admdongkor, Overture divisions and others) without overwriting source values; low-volume countries use a city-level contract.
          - Added a Nigeria Geofabrik extract, Brazil and Singapore Overture addresses, and US Overture state partitions with USA Structures residential evidence.
          - Address rules follow local conventions: China publishes communities with road and house number optional, and an unverifiable postcode outside China is left empty instead of rejecting the address.
          - Fills missing postcodes from Census ZCTA and ABS POA boundaries, unique GeoNames places, Taiwan township zones and the China district catalog, including province-administered districts.
          - Rejects placeholder street names, conversational or transliterated Chinese translations, and source text whose characters were lost; rejected rows are retired for retranslation.
          - Taiwan names use the official 臺 form; the China city catalog restores truncated names and moves Jiangsu cities filed under Taiwan back to Jiangsu.

          ### Translation and publication
          - Each provider credential has an adjustable concurrency, and translation backfill sends requests in parallel within each route's limit.
          - Publication takes row locks only and updates generation ranks incrementally, so large backlogs publish about 90 times faster.
          - Below-target countries are translated and published first; ordinary addresses publish before their Chinese street name is translated.

          ### Synchronization and deployment
          - Country targets up to one billion addresses, with a storage budget that stops at a 10 GiB free-disk floor.
          - Sync history credits each run only with its own import; failed runs show no growth, and runs interrupted by a restart or deploy are recorded as interrupted instead of staying running.
          - Large imports no longer time out: finalization writes only changed rows and an evidence index is built concurrently at startup.
          - Production activation runs detached, waits for the running sync job, and removes images of pruned releases and stale build cache.
          - The public generator renders the first address without a loading pass and serves country counts from the admin coverage snapshot.

          ### Verification
          - Verified 1,508 JavaScript/TypeScript tests, 108 Python tests, type checks, builds, and 500 live address-contract samples for each of the 27 supported countries.
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
